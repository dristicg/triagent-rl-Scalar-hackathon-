name: medical-triage-v1
version: "1.0.0"
description: >
  A medical triage environment using the Emergency Severity Index (ESI) standard.
  Agent must assess patient vitals, complaints, and history to assign ESI levels
  and manage emergency department resources under surge conditions.
author: "TriageNet-RL Team"
license: MIT
tags: [medical, triage, healthcare, RL, LLM-native, OpenEnv]
entry_file: inference.py

environment:
  type: sequential
  observation_type: structured
  action_type: discrete+structured
  reward_type: dense
  episode_termination: all_patients_triaged_or_max_steps

tasks:
  - id: 1
    name: "Easy: Single Patient ESI"
    difficulty: easy
    max_steps: 5
    pass_threshold: 0.60
  - id: 2
    name: "Medium: Multi-Patient Queue"
    difficulty: medium
    max_steps: 20
    pass_threshold: 0.65
  - id: 3
    name: "Hard: Mass Casualty Surge"
    difficulty: hard
    max_steps: 40
    pass_threshold: 0.55

observation_space:
  type: object
  fields:
    task_id: integer
    step: integer
    max_steps: integer
    current_patient: object
    pending_patients: list[string]
    triaged_patients: list[string]
    bed_status: object
    time_elapsed_minutes: integer
    alerts: list[string]
    task_description: string
    score_so_far: float

action_space:
  type: object
  fields:
    action_type:
      type: enum
      values: [assign_esi, request_resources, wait]
    patient_id: {type: string, required: true}
    esi_level: {type: integer, range: [1,5], required_for: [assign_esi]}
    routing_zone:
      type: enum
      values: [resuscitation_bay, acute_care, fast_track, waiting_room]
      required_for: [assign_esi]

reward_structure:
  dense: true
  range: [-1.0, 1.0]
  components:
    esi_correct: +0.10
    resource_waste: -0.05
    wait_penalty: -0.08
    critical_miss: -0.50
    deterioration: -0.35

baseline_scores:
  agent: random
  seed: 42
  task1: 0.1
  task2: 0.05
  task3: 0.02

dependencies:
  python: ">=3.9"
  packages: [openai, pydantic, pyyaml]
