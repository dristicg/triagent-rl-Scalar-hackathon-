[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triagenet-rl"
version = "1.0.0"
description = "Medical ED Triage OpenEnv"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.0,<5.0",
    "huggingface_hub<0.26.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "numpy>=1.24"
]
