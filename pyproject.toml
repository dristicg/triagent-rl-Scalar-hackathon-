[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triagenet-rl"
version = "1.0.0"
description = "Medical ED Triage OpenEnv"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml",
    "openai",
    "numpy",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"
